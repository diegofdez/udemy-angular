<h1>Dragon Ball Page</h1>

<section class="row">
  <div class="col-12 col-sm-6">
    <h3>Agregar: {{name()}} - {{power()}}</h3>
    <input
      type="text"
      class="form-control mb-2"
      placeholder="Nombre del personaje"
      [value]="name()"
      (change)="name.set(txtName.value)"
      #txtName
    />
    <input
      type="number" class="form-control mb-2" placeholder="Poder del personaje"
      [value]="power()"
      (change)="power.set(txtPower.valueAsNumber)"
      #txtPower
    />
    <button (click)="addCharacter()" class="btn btn-primary">Agregar</button>
  </div>

  <div class="col-12 col-sm-6">
    <h3>Personajes:</h3>
    <ul>

      @for (character of characters(); track character.id; let idx = $index) {
        @if (character.power > 500) {
          <li>
            <span>{{ idx + 1 }}. {{ character.name }}</span>
            <strong [class.text-danger]="character.power > 9000">
              ({{ character.power }})</strong>
          </li>
        } @else {
          <li><strong>Aqui no hay nadie</strong></li>
        }
      }

    </ul>
  </div>
</section>

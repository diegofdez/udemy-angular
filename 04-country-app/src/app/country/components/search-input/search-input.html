<section class="flex flex-row gap-2 mt-2">
  <input type="text"
    class="input input-bordered mr-2 w-56"
    autofocus
    [placeholder]="placeholder()"
    [value]="inputValue()"
    (keyup)="inputValue.set(textSearch.value)"
    #textSearch
  />

  <button class="btn btn-primary"
    (click)="searchValue.emit(textSearch.value)"
  >Buscar</button>
</section>
